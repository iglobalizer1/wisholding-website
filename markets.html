<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Export Markets | Interactive Footprint - Wish Holdings</title>
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Fonts / Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Markets Layout */
        .markets-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--spacing-lg);
            margin-top: var(--spacing-lg);
        }
        @media (min-width: 992px) {
            .markets-layout {
                grid-template-columns: 2fr 1.2fr;
            }
        }

        /* SVG Map interactions */
        .interactive-map-svg {
            width: 100%;
            background: radial-gradient(circle at center, var(--color-secondary) 0%, var(--color-primary) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--border-radius-lg);
            padding: var(--spacing-md);
        }
        .map-dot {
            cursor: pointer;
            transition: r var(--transition-fast), fill var(--transition-fast);
        }
        .map-dot:hover, .map-dot.active {
            r: 12px;
            fill: #FFFFFF;
            stroke: var(--color-accent);
            stroke-width: 3px;
        }
        .map-connection-line {
            stroke-dasharray: 6,6;
            animation: dash 30s linear infinite;
        }
        @keyframes dash {
            to {
                stroke-dashoffset: -1000;
            }
        }

        /* Detail display panel */
        .market-info-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--border-radius-md);
            padding: var(--spacing-md);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            min-height: 350px;
        }
    </style>
</head>
<body>

    <!-- Inner Page Header -->
    <section class="inner-hero">
        <div class="inner-hero-bg"></div>
        <div class="container text-center">
            <span class="section-subtitle">Global Operations</span>
            <h1 class="text-white">Export Markets</h1>
            <p style="max-width: 600px; margin: 10px auto 0 auto;">Wish Holdings links Maldivian fisheries with premium distributors worldwide. Click a global hub below to view specific local trade details.</p>
        </div>
    </section>

    <!-- Markets section -->
    <section class="section-padding" style="background-color: var(--color-primary);">
        <div class="container">
            <div class="markets-layout">
                
                <!-- Interactive SVG Map -->
                <div class="reveal">
                    <svg class="interactive-map-svg" viewBox="0 0 1000 500" id="world-map">
                        <rect width="1000" height="500" fill="none"/>
                        
                        <!-- Continent shapes outlines -->
                        <path d="M100,120 Q120,60 180,80 T260,70 T310,130 T280,220 T210,320 T150,380 T100,280 Z" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)"/>
                        <path d="M420,100 Q480,50 560,70 T660,50 T710,120 T610,220 T580,350 T480,280 Z" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)"/>
                        <path d="M780,260 Q820,240 880,280 T860,360 T780,330 Z" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)"/>

                        <!-- Connection corridors (Maldives Hub outwards) -->
                        <path d="M 520 220 Q 330 110 180 160" fill="none" stroke="rgba(212,175,55,0.15)" stroke-width="1.5" class="map-connection-line" id="line-usa"/>
                        <path d="M 520 220 Q 560 120 580 110" fill="none" stroke="rgba(212,175,55,0.15)" stroke-width="1.5" class="map-connection-line" id="line-eu"/>
                        <path d="M 520 220 Q 590 190 620 180" fill="none" stroke="rgba(212,175,55,0.15)" stroke-width="1.5" class="map-connection-line" id="line-uk"/>
                        <path d="M 520 220 Q 640 180 720 140" fill="none" stroke="rgba(212,175,55,0.15)" stroke-width="1.5" class="map-connection-line" id="line-japan"/>
                        <path d="M 520 220 Q 680 280 830 310" fill="none" stroke="rgba(212,175,55,0.15)" stroke-width="1.5" class="map-connection-line" id="line-australia"/>

                        <!-- Maldives Hub -->
                        <circle cx="520" cy="220" r="10" fill="var(--color-accent)" class="pulse-node" style="stroke:rgba(212,175,55,0.4); stroke-width:4px;"/>
                        <text x="520" y="245" fill="var(--color-accent)" font-family="var(--font-heading)" font-size="11" font-weight="700" text-anchor="middle">MALDIVES HQ</text>

                        <!-- Market Hub Nodes -->
                        <!-- North America -->
                        <circle cx="180" cy="160" r="7" fill="var(--color-aqua)" class="map-dot" id="dot-usa" onclick="selectMarket('usa')"/>
                        <text x="180" y="145" fill="#FFFFFF" font-family="var(--font-heading)" font-size="10" text-anchor="middle">USA & CANADA</text>

                        <!-- Europe (Germany) -->
                        <circle cx="580" cy="110" r="7" fill="var(--color-aqua)" class="map-dot" id="dot-eu" onclick="selectMarket('eu')"/>
                        <text x="580" y="95" fill="#FFFFFF" font-family="var(--font-heading)" font-size="10" text-anchor="middle">EUROPE (GERMANY)</text>

                        <!-- United Kingdom -->
                        <circle cx="620" cy="180" r="7" fill="var(--color-aqua)" class="map-dot" id="dot-uk" onclick="selectMarket('uk')"/>
                        <text x="620" y="165" fill="#FFFFFF" font-family="var(--font-heading)" font-size="10" text-anchor="middle">UNITED KINGDOM</text>

                        <!-- Japan -->
                        <circle cx="720" cy="140" r="7" fill="var(--color-aqua)" class="map-dot" id="dot-japan" onclick="selectMarket('japan')"/>
                        <text x="720" y="125" fill="#FFFFFF" font-family="var(--font-heading)" font-size="10" text-anchor="middle">JAPAN (TOKYO)</text>

                        <!-- Australia -->
                        <circle cx="830" cy="310" r="7" fill="var(--color-aqua)" class="map-dot" id="dot-australia" onclick="selectMarket('australia')"/>
                        <text x="830" y="295" fill="#FFFFFF" font-family="var(--font-heading)" font-size="10" text-anchor="middle">AUSTRALIA</text>
                    </svg>
                </div>

                <!-- Info panel for active market -->
                <div class="reveal" style="transition-delay: 0.15s;">
                    <div class="market-info-panel" id="market-panel-target">
                        <!-- Populated via JS -->
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- JS Files -->
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script>
        const marketDetails = {
            usa: {
                title: "North America (USA & Canada)",
                volume: "1,200 Metric Tons / Year",
                products: "Super-Frozen Sashimi Yellowfin Tuna Loins, Blast Frozen Chilled Chunks, Private-label Canned Skipjack",
                partners: "Pacific Oceanside Foods Inc. & Seattle Fresh Logistics Co.",
                transit: "Chilled air-freight to LAX/SEA (36 hours transit) or Super-freeze cargo vessel (-60C containers, 24 days transit)",
                description: "Serving high-end sushi grade restaurants, boutique seafood chains, and organic supermarket distributors across the Pacific Northwest and California."
            },
            eu: {
                title: "European Union (Germany / France / Spain)",
                volume: "2,400 Metric Tons / Year",
                products: "MSC-certified pole-and-line Chilled Yellowfin Tuna loins, AQUATUNA™ Gourmet Canned lines, IQF tuna steaks",
                partners: "EuroSeafood Import GmbH, Atlantic Distribution S.A.",
                transit: "Direct freight to Frankfurt Airport (cargo routes) or sea container routes calling Hamburg and Rotterdam ports (18 days transit)",
                description: "Supplying major retail supermarket groups and food service brokers seeking dolphin-safe, fully traceable sustainable seafood commodities."
            },
            uk: {
                title: "United Kingdom (London Hub)",
                volume: "950 Metric Tons / Year",
                products: "AQUATUNA™ retail canned tuna (Olive oil / Water), Sustainable Handline Chilled loins",
                partners: "Albion Fine Seafoods Ltd, British Retail Sourcing Group",
                transit: "Direct air-freight to London Heathrow (LHR) or sea freight (22 days transit)",
                description: "Our canned tuna products are distributed widely across major premium grocers and specialty health stores in the UK."
            },
            japan: {
                title: "Japan (Tokyo Toyosu Market)",
                volume: "3,100 Metric Tons / Year",
                products: "Ultra-Premium Sashimi Yellowfin Tuna (Super Frozen H&G and Grade A Loins)",
                partners: "Toyosu Tuna Auction Brokerage K.K., Yamato Seafood Logistics",
                transit: "Direct express air freight to Tokyo Narita (NRT) in specialized dry ice insulated containers (under 24 hours total post-harvest time)",
                description: "Catering to Tokyo's historic sushi brokers and elite Toyosu auction markets, requiring absolute grade color indexes and fat configurations."
            },
            australia: {
                title: "Australia (Sydney Fish Market Hub)",
                volume: "800 Metric Tons / Year",
                products: "Saku blocks, Chilled steaks, AZURISH™ Premium fish sausages, Canned Tuna",
                partners: "Southern Cross Seafood Wholesalers, Oceania Food Services",
                transit: "Air-freight corridors to Sydney and Melbourne (28 hours) or reefer sea container routes (14 days transit)",
                description: "Providing high-protein ready-to-eat snack innovations (AZURISH™) and fresh-frozen steaks to retail and fitness distributors."
            }
        };

        function selectMarket(key) {
            // Remove active classes
            document.querySelectorAll(".map-dot").forEach(dot => dot.classList.remove("active"));
            
            // Add active class
            const dot = document.getElementById("dot-" + key);
            if (dot) dot.classList.add("active");

            const info = marketDetails[key];
            if (!info) return;

            const target = document.getElementById("market-panel-target");
            target.innerHTML = `
                <div>
                    <span class="section-subtitle">Active Region</span>
                    <h2 class="text-white" style="font-size: 1.5rem; margin-top:5px;">${info.title}</h2>
                </div>
                
                <div>
                    <span style="font-size:0.8rem; color:var(--color-accent); font-weight:600; text-transform:uppercase; letter-spacing:1px; display:block; margin-bottom:2px;">Annual Export Volume</span>
                    <p style="color:var(--color-text-heading); font-size:1.1rem; font-weight:700;"><i class="fas fa-chart-line text-gold"></i> ${info.volume}</p>
                </div>

                <div>
                    <span style="font-size:0.8rem; color:var(--color-accent); font-weight:600; text-transform:uppercase; letter-spacing:1px; display:block; margin-bottom:2px;">Export Commodities</span>
                    <p style="font-size:0.9rem; color:var(--color-text-body);">${info.products}</p>
                </div>

                <div>
                    <span style="font-size:0.8rem; color:var(--color-accent); font-weight:600; text-transform:uppercase; letter-spacing:1px; display:block; margin-bottom:2px;">Distribution Partners</span>
                    <p style="font-size:0.9rem; color:var(--color-text-body);">${info.partners}</p>
                </div>

                <div>
                    <span style="font-size:0.8rem; color:var(--color-accent); font-weight:600; text-transform:uppercase; letter-spacing:1px; display:block; margin-bottom:2px;">Transit Lanes</span>
                    <p style="font-size:0.9rem; color:var(--color-text-body);"><i class="fas fa-plane-departure text-aqua"></i> ${info.transit}</p>
                </div>

                <div style="border-top: 1px solid rgba(255,255,255,0.05); padding-top: var(--spacing-sm); margin-top: auto;">
                    <p style="font-size:0.85rem; font-style:italic;">${info.description}</p>
                </div>
            `;
        }

        // Initialize default select USA
        document.addEventListener("DOMContentLoaded", () => {
            selectMarket("usa");
        });
    </script>
</body>
</html>
